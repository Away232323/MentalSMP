<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MentalSMP | The Ultimate Minecraft SMP</title>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">


<style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}



body{

    min-height:100vh;

    color:white;

    overflow-x:hidden;

    background:
    radial-gradient(circle at top,#581c87 0%,transparent 35%),
    radial-gradient(circle at bottom,#7c3aed 0%,transparent 30%),
    linear-gradient(135deg,#020202,#10051c,#020202);

}




body::before{

    content:"";

    position:fixed;

    width:500px;
    height:500px;

    background:#a855f7;

    filter:blur(180px);

    opacity:.25;

    top:10%;
    left:10%;

    animation:glow 10s infinite alternate;

    z-index:-1;

}



body::after{

    content:"";

    position:fixed;

    width:400px;
    height:400px;

    background:#6366f1;

    filter:blur(160px);

    opacity:.25;

    right:10%;
    bottom:10%;

    animation:glow2 12s infinite alternate;

    z-index:-1;

}



@keyframes glow{

from{
transform:translate(0,0);
}

to{
transform:translate(120px,80px);
}

}



@keyframes glow2{

from{
transform:translate(0,0);
}

to{
transform:translate(-100px,-80px);
}

}





nav{

height:100px;

padding:0 70px;

display:flex;

justify-content:space-between;

align-items:center;

background:rgba(0,0,0,.35);

backdrop-filter:blur(20px);

border-bottom:1px solid rgba(255,255,255,.1);

position:fixed;

top:0;

width:100%;

z-index:10;

}



.logo{

font-size:40px;

font-weight:900;

color:#c084fc;

text-shadow:

0 0 20px #a855f7,
0 0 50px #7c3aed;

}




.links a{

color:white;

text-decoration:none;

margin-left:35px;

font-weight:700;

transition:.3s;

}



.links a:hover{

color:#c084fc;

text-shadow:0 0 15px #a855f7;

}






.hero{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

text-align:center;

padding:120px 20px 50px;

}





.hero h1{

font-size:120px;

font-weight:900;

letter-spacing:8px;

color:#c084fc;


text-shadow:

0 0 30px #a855f7,
0 0 80px #7c3aed;


animation:float 4s infinite ease-in-out;

}



@keyframes float{

50%{

transform:translateY(-15px);

}

}




.hero p{

font-size:32px;

color:#ddd;

margin-top:20px;

}






.server-box{


margin-top:50px;

padding:40px 80px;

background:rgba(20,20,30,.65);

border-radius:35px;

border:1px solid rgba(192,132,252,.4);

backdrop-filter:blur(25px);


box-shadow:

0 0 50px rgba(168,85,247,.3);

}




.server-title{

color:#aaa;

font-size:18px;

}



.ip{

font-size:40px;

font-weight:900;

color:#d8b4fe;

margin:15px;

}




.buttons{

display:flex;

justify-content:center;

gap:20px;

margin-top:25px;

}





button{

padding:18px 45px;

border:none;

border-radius:18px;

background:#a855f7;

color:white;

font-size:18px;

font-weight:800;

cursor:pointer;

transition:.3s;

}



button:hover{

transform:scale(1.08);

box-shadow:0 0 35px #a855f7;

}




.discord{

background:#5865F2;

}
