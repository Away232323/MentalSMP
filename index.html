<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MentalSMP</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#0d0d0d;
            color:white;
            overflow-x:hidden;
        }

        header{
            height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            animation:fadeUp 1.2s;
        }

        h1{
            font-size:70px;
            color:#9b59ff;
        }

        p{
            margin-top:15px;
            font-size:22px;
            color:#bdbdbd;
        }

        nav{
            margin-top:50px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:15px;
            font-size:22px;
            transition:.3s;
        }

        nav a:hover{
            color:#9b59ff;
        }

        @keyframes fadeUp{
            from{
                opacity:0;
                transform:translateY(80px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }
    </style>

</head>
<body>

<header>

<h1>MentalSMP</h1>

<p>The Ultimate Minecraft SMP</p>

<nav>
<a href="#">Rules</a>
<a href="#">Ranks</a>
<a href="#">Store</a>
<a href="#">Discord</a>
</nav>

</header>

</body>
</html>
